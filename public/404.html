<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — LinkMágico</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#06060e;color:#f0eeff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.c{max-width:480px}
h1{font-size:5rem;font-weight:900;background:linear-gradient(135deg,#7c3aed,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
p{color:#7a7896;font-size:1.1rem;line-height:1.6;margin-bottom:32px}
a{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:14px 28px;border-radius:12px;font-weight:700;text-decoration:none;transition:transform .2s}
a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="c">
<h1>404</h1>
<p>A página que você procura não existe ou foi movida. Volte para a página principal e continue navegando.</p>
<a href="/">⚡ Voltar ao início</a>
</div>
</body>
</html>
