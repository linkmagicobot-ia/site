<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Sorriso Prime</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc; /* Fundo leve e moderno */
            font-family: sans-serif;
        }
        .logo-container {
            max-width: 80%;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Puxando a imagem que já está no seu repositório -->
        <img src="logosorriprime.png" alt="Logo Sorriso Prime Odontologia">
    </div>

</body>
</html>
